<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RJQ Dashboard</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        padding: 2rem;
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 1.5rem;
        color: #38bdf8;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1rem;
        margin-bottom: 2rem;
      }
      .stat {
        background: #1e293b;
        border-radius: 0.5rem;
        padding: 1.25rem;
        text-align: center;
      }
      .stat-value {
        font-size: 2rem;
        font-weight: 700;
      }
      .stat-label {
        font-size: 0.8rem;
        color: #94a3b8;
        margin-top: 0.25rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .stat.pending .stat-value {
        color: #facc15;
      }
      .stat.processing .stat-value {
        color: #38bdf8;
      }
      .stat.completed .stat-value {
        color: #4ade80;
      }
      .stat.failed .stat-value {
        color: #f87171;
      }

      .section-title {
        font-size: 1rem;
        color: #94a3b8;
        margin-bottom: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .queue-bar {
        background: #1e293b;
        border-radius: 0.5rem;
        padding: 1rem;
        margin-bottom: 2rem;
        min-height: 3rem;
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        align-items: center;
      }
      .queue-item {
        background: #334155;
        color: #38bdf8;
        padding: 0.35rem 0.75rem;
        border-radius: 0.25rem;
        font-size: 0.75rem;
        font-family: monospace;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: #1e293b;
        border-radius: 0.5rem;
        overflow: hidden;
      }
      th,
      td {
        padding: 0.75rem 1rem;
        text-align: left;
        font-size: 0.8rem;
      }
      th {
        background: #334155;
        color: #94a3b8;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      td {
        border-bottom: 1px solid #334155;
      }
      tr:last-child td {
        border-bottom: none;
      }
      .badge {
        padding: 0.15rem 0.5rem;
        border-radius: 0.25rem;
        font-size: 0.7rem;
        font-weight: 600;
        text-transform: uppercase;
      }
      .badge-pending {
        background: #facc15;
        color: #0f172a;
      }
      .badge-processing {
        background: #38bdf8;
        color: #0f172a;
      }
      .badge-completed {
        background: #4ade80;
        color: #0f172a;
      }
      .badge-failed {
        background: #f87171;
        color: #0f172a;
      }

      .refresh {
        color: #64748b;
        font-size: 0.7rem;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <h1>RJQ Dashboard</h1>

    <div class="stats">
      <div class="stat pending">
        <div class="stat-value" id="stat-pending">0</div>
        <div class="stat-label">Pending</div>
      </div>
      <div class="stat processing">
        <div class="stat-value" id="stat-processing">0</div>
        <div class="stat-label">Processing</div>
      </div>
      <div class="stat completed">
        <div class="stat-value" id="stat-completed">0</div>
        <div class="stat-label">Completed</div>
      </div>
      <div class="stat failed">
        <div class="stat-value" id="stat-failed">0</div>
        <div class="stat-label">Failed</div>
      </div>
    </div>

    <div class="section-title">Queue (in memory)</div>
    <div class="queue-bar" id="queue-bar">
      <span style="color: #64748b; font-size: 0.8rem">No jobs in queue</span>
    </div>

    <div class="section-title">Recent Jobs</div>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>To</th>
          <th>Subject</th>
          <th>Status</th>
          <th>Retries</th>
          <th>Created</th>
        </tr>
      </thead>
      <tbody id="jobs-table"></tbody>
    </table>

    <div class="refresh">Auto-refreshing every 2s</div>

    <script>
      async function fetchData() {
        const [statsRes, jobsRes] = await Promise.all([
          fetch("/stats"),
          fetch("/jobs"),
        ]);
        const stats = await statsRes.json();
        const jobs = await jobsRes.json();

        // Stats
        document.getElementById("stat-pending").textContent =
          stats.pending || 0;
        document.getElementById("stat-completed").textContent = jobs.filter(
          (j) => j.status === "completed",
        ).length;
        document.getElementById("stat-failed").textContent = jobs.filter(
          (j) => j.status === "failed",
        ).length;
        document.getElementById("stat-processing").textContent = jobs.filter(
          (j) => j.status === "processing",
        ).length;

        // Queue bar
        const queueBar = document.getElementById("queue-bar");
        const pendingJobs = jobs.filter((j) => j.status === "pending");
        if (pendingJobs.length === 0) {
          queueBar.innerHTML =
            '<span style="color:#64748b;font-size:0.8rem;">No jobs in queue</span>';
        } else {
          queueBar.innerHTML = pendingJobs
            .map(
              (j, i) =>
                `<div class="queue-item">#${i + 1}: ${j.id.substring(0, 8)}...</div>`,
            )
            .join("");
        }

        // Jobs table
        const tbody = document.getElementById("jobs-table");
        const recentJobs = jobs.slice(0, 20);
        tbody.innerHTML = recentJobs
          .map(
            (j) => `
    <tr>
      <td style="font-family:monospace;font-size:0.7rem;">${j.id.substring(0, 12)}...</td>
      <td>${j.to}</td>
      <td>${j.subject}</td>
      <td><span class="badge badge-${j.status}">${j.status}</span></td>
      <td>${j.retry_count}/${j.max_retries}</td>
      <td style="font-size:0.7rem;color:#94a3b8;">${new Date(j.created_at).toLocaleTimeString()}</td>
    </tr>
  `,
          )
          .join("");
      }

      fetchData();
      setInterval(fetchData, 2000);
    </script>
  </body>
</html>
