<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RJQ Dashboard</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        padding: 2rem;
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 0.25rem;
        color: #38bdf8;
      }
      .subtitle {
        color: #64748b;
        font-size: 0.8rem;
        margin-bottom: 1.5rem;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1rem;
        margin-bottom: 2rem;
      }
      .stat {
        background: #1e293b;
        border-radius: 0.5rem;
        padding: 1.25rem;
        text-align: center;
      }
      .stat-value {
        font-size: 2rem;
        font-weight: 700;
      }
      .stat-label {
        font-size: 0.8rem;
        color: #94a3b8;
        margin-top: 0.25rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .stat.pending .stat-value {
        color: #facc15;
      }
      .stat.processing .stat-value {
        color: #38bdf8;
      }
      .stat.completed .stat-value {
        color: #4ade80;
      }
      .stat.failed .stat-value {
        color: #f87171;
      }

      .section-title {
        font-size: 1rem;
        color: #94a3b8;
        margin-bottom: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .queues-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1rem;
        margin-bottom: 2rem;
      }
      .queue-column {
        background: #1e293b;
        border-radius: 0.5rem;
        padding: 1rem;
      }
      .queue-column-header {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 0.5rem;
        padding-bottom: 0.5rem;
        border-bottom: 1px solid #334155;
      }
      .queue-column-header.fifo {
        color: #facc15;
      }
      .queue-column-header.priority {
        color: #fb923c;
      }
      .queue-column-header.rate {
        color: #38bdf8;
      }
      .queue-mini-item {
        padding: 0.3rem 0.5rem;
        border-radius: 0.2rem;
        font-size: 0.7rem;
        font-family: monospace;
        margin-bottom: 0.25rem;
        display: flex;
        align-items: center;
        gap: 0.3rem;
      }
      .queue-mini-item.prio-1 {
        background: #334155;
        color: #facc15;
        border-left: 2px solid #facc15;
      }
      .queue-mini-item.prio-2 {
        background: #3b2200;
        color: #fb923c;
        border-left: 2px solid #fb923c;
      }
      .queue-mini-item.prio-3 {
        background: #3b0000;
        color: #f87171;
        border-left: 2px solid #f87171;
        animation: urgentPulse 1s infinite;
      }
      @keyframes urgentPulse {
        0%,
        100% {
          box-shadow: 0 0 4px rgba(248, 113, 113, 0.3);
        }
        50% {
          box-shadow: 0 0 12px rgba(248, 113, 113, 0.7);
        }
      }
      .queue-empty {
        color: #64748b;
        font-size: 0.7rem;
        font-style: italic;
      }
      .queue-count {
        font-size: 0.65rem;
        color: #64748b;
        margin-bottom: 0.5rem;
      }
      .queue-badge {
        padding: 0.1rem 0.35rem;
        border-radius: 0.15rem;
        font-size: 0.55rem;
        font-weight: 700;
        text-transform: uppercase;
      }
      .queue-badge.urgent {
        background: #fb923c;
        color: #0f172a;
      }
      .queue-badge.super {
        background: #f87171;
        color: #0f172a;
        animation: urgentPulse 1s infinite;
      }

      .tokens-display {
        font-size: 0.6rem;
        color: #38bdf8;
        margin-top: 0.5rem;
        padding-top: 0.5rem;
        border-top: 1px solid #334155;
      }
      .tokens-bar {
        width: 100%;
        height: 0.3rem;
        background: #334155;
        border-radius: 0.15rem;
        margin-top: 0.25rem;
        overflow: hidden;
      }
      .tokens-fill {
        height: 100%;
        background: #38bdf8;
        border-radius: 0.15rem;
        transition: width 1s linear;
      }

      .worker-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 1rem;
        margin-bottom: 2rem;
      }
      .worker-card {
        background: #1e293b;
        border-radius: 0.5rem;
        padding: 1.5rem 1rem;
        text-align: center;
        transition: all 0.3s ease;
      }
      .worker-card.active {
        border: 1px solid #38bdf8;
      }
      .worker-card.active.priority-2 {
        border: 2px solid #fb923c;
        box-shadow: 0 0 8px rgba(251, 146, 60, 0.3);
      }
      .worker-card.active.priority-3 {
        border: 2px solid #f87171;
        box-shadow: 0 0 12px rgba(248, 113, 113, 0.4);
      }
      .worker-card.completed-flash {
        border: 1px solid #4ade80;
        background: #14532d;
      }
      .worker-card.failed-flash {
        border: 1px solid #f87171;
        background: #7f1d1d;
      }
      .worker-name {
        font-size: 0.75rem;
        font-weight: 600;
        color: #94a3b8;
        margin-bottom: 0.5rem;
      }
      .worker-card.active .worker-name {
        color: #38bdf8;
      }
      .worker-card.active.priority-2 .worker-name {
        color: #fb923c;
      }
      .worker-card.active.priority-3 .worker-name {
        color: #f87171;
      }
      .worker-status {
        font-size: 0.65rem;
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .worker-card.active .worker-status {
        color: #38bdf8;
      }
      .worker-card.active.priority-2 .worker-status {
        color: #fb923c;
      }
      .worker-card.active.priority-3 .worker-status {
        color: #f87171;
      }
      .priority-badge {
        display: inline-block;
        padding: 0.1rem 0.4rem;
        border-radius: 0.15rem;
        font-size: 0.55rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 0.3rem;
      }
      .priority-badge.prio-1 {
        background: #334155;
        color: #94a3b8;
      }
      .priority-badge.prio-2 {
        background: #fb923c;
        color: #0f172a;
      }
      .priority-badge.prio-3 {
        background: #f87171;
        color: #0f172a;
      }
      .queue-type-badge {
        display: inline-block;
        padding: 0.1rem 0.3rem;
        border-radius: 0.15rem;
        font-size: 0.5rem;
        font-weight: 600;
        text-transform: uppercase;
        margin-bottom: 0.3rem;
      }
      .queue-type-badge.fifo {
        background: #334155;
        color: #facc15;
      }
      .queue-type-badge.priority {
        background: #334155;
        color: #fb923c;
      }
      .queue-type-badge.rate-limited {
        background: #334155;
        color: #38bdf8;
      }
      .spinner {
        width: 2rem;
        height: 2rem;
        border: 3px solid #334155;
        border-radius: 50%;
        margin: 0.5rem auto;
      }
      .worker-card.active .spinner {
        border-top-color: #38bdf8;
        animation: spin 0.8s linear infinite;
      }
      .worker-card.active.priority-2 .spinner {
        border-top-color: #fb923c;
        border-left-color: #fb923c;
      }
      .worker-card.active.priority-3 .spinner {
        border-top-color: #f87171;
        border-left-color: #f87171;
        animation: spin 0.5s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .result-icon {
        font-size: 1.5rem;
        margin: 0.5rem auto;
      }
      .worker-job-id {
        font-size: 0.6rem;
        color: #94a3b8;
        font-family: monospace;
        margin-top: 0.35rem;
        word-break: break-all;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: #1e293b;
        border-radius: 0.5rem;
        overflow: hidden;
      }
      th,
      td {
        padding: 0.75rem 1rem;
        text-align: left;
        font-size: 0.8rem;
      }
      th {
        background: #334155;
        color: #94a3b8;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      td {
        border-bottom: 1px solid #334155;
      }
      tr:last-child td {
        border-bottom: none;
      }
      .badge {
        padding: 0.15rem 0.5rem;
        border-radius: 0.25rem;
        font-size: 0.7rem;
        font-weight: 600;
        text-transform: uppercase;
      }
      .badge-pending {
        background: #facc15;
        color: #0f172a;
      }
      .badge-processing {
        background: #38bdf8;
        color: #0f172a;
      }
      .badge-completed {
        background: #4ade80;
        color: #0f172a;
      }
      .badge-failed {
        background: #f87171;
        color: #0f172a;
      }
      tr.row-completed {
        animation: rowFlash 0.5s ease;
      }
      @keyframes rowFlash {
        0% {
          background: #14532d;
        }
        100% {
          background: transparent;
        }
      }
      tr.row-failed {
        animation: rowFlashRed 0.5s ease;
      }
      @keyframes rowFlashRed {
        0% {
          background: #7f1d1d;
        }
        100% {
          background: transparent;
        }
      }

      .refresh {
        color: #64748b;
        font-size: 0.7rem;
        margin-top: 1rem;
        text-align: center;
      }

      .worker-card {
        transition:
          border 0.3s ease,
          background 0.3s ease,
          box-shadow 0.3s ease;
      }
      @keyframes flashFade {
        0% {
          background: #14532d;
          border-color: #4ade80;
        }
        70% {
          background: #14532d;
          border-color: #4ade80;
        }
        100% {
          background: #1e293b;
          border-color: transparent;
        }
      }
      @keyframes flashFadeRed {
        0% {
          background: #7f1d1d;
          border-color: #f87171;
        }
        70% {
          background: #7f1d1d;
          border-color: #f87171;
        }
        100% {
          background: #1e293b;
          border-color: transparent;
        }
      }
    </style>
  </head>
  <body>
    <h1>RJQ Dashboard</h1>
    <div class="subtitle">
      Multi-Queue System — FIFO · Priority · Rate-Limited
    </div>

    <div class="stats">
      <div class="stat pending">
        <div class="stat-value" id="stat-pending">0</div>
        <div class="stat-label">Pending</div>
      </div>
      <div class="stat processing">
        <div class="stat-value" id="stat-processing">0</div>
        <div class="stat-label">Processing</div>
      </div>
      <div class="stat completed">
        <div class="stat-value" id="stat-completed">0</div>
        <div class="stat-label">Completed</div>
      </div>
      <div class="stat failed">
        <div class="stat-value" id="stat-failed">0</div>
        <div class="stat-label">Failed</div>
      </div>
    </div>

    <div class="section-title">Queues</div>
    <div class="queues-grid">
      <div class="queue-column">
        <div class="queue-column-header fifo">FIFO</div>
        <div class="queue-count" id="count-fifo">0 jobs</div>
        <div id="queue-fifo"><span class="queue-empty">Empty</span></div>
      </div>
      <div class="queue-column">
        <div class="queue-column-header priority">Priority</div>
        <div class="queue-count" id="count-priority">0 jobs</div>
        <div id="queue-priority"><span class="queue-empty">Empty</span></div>
      </div>
      <div class="queue-column">
        <div class="queue-column-header rate">Rate-Limited</div>
        <div class="queue-count" id="count-rate">0 jobs</div>
        <div id="queue-rate"><span class="queue-empty">Empty</span></div>
        <div class="tokens-display" id="tokens-display"></div>
      </div>
    </div>

    <div class="section-title">Workers</div>
    <div class="worker-grid" id="worker-grid">
      <span style="color: #64748b; font-size: 0.8rem">Loading...</span>
    </div>

    <div class="section-title">Recent Jobs</div>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>To</th>
          <th>Subject</th>
          <th>Queue</th>
          <th>Priority</th>
          <th>Status</th>
          <th>Retries</th>
          <th>Created</th>
        </tr>
      </thead>
      <tbody id="jobs-table"></tbody>
    </table>

    <div class="refresh">Auto-refreshing every 2s</div>

    <script>
      var previousJobs = {};
      var previousProcessingIds = [null, null, null, null, null];
      var workerFlash = [null, null, null, null, null];

      var prioNames = ["", "NORMAL", "URGENT", "SUPER"];
      var prioColors = ["", "#94a3b8", "#fb923c", "#f87171"];
      var queueLabels = {
        fifo: "FIFO",
        priority: "PRI",
        "rate-limited": "RATE",
      };
      var queueColors = {
        fifo: "#facc15",
        priority: "#fb923c",
        "rate-limited": "#38bdf8",
      };

      function timeAgo(dateStr) {
        var now = new Date();
        var then = new Date(dateStr);
        var diff = Math.floor((now - then) / 1000);
        if (diff < 0) diff = 0;
        if (diff < 60) return diff + "s ago";
        if (diff < 3600) return Math.floor(diff / 60) + "m ago";
        return Math.floor(diff / 3600) + "h ago";
      }

      function fetchData() {
        Promise.all([
          fetch("/stats"),
          fetch("/processing"),
          fetch("/pending"),
          fetch("/jobs"),
        ])
          .then(function (results) {
            return Promise.all([
              results[0].json(),
              results[1].json(),
              results[2].json(),
              results[3].json(),
            ]);
          })
          .then(function (data) {
            var stats = data[0];
            var processing = data[1];
            var pending = data[2];
            var jobs = data[3];

            var currentJobs = {};
            jobs.forEach(function (j) {
              currentJobs[j.id] = j;
            });

            var completedCount = jobs.filter(function (j) {
              return j.status === "completed";
            }).length;
            var failedCount = jobs.filter(function (j) {
              return j.status === "failed";
            }).length;

            document.getElementById("stat-pending").textContent = stats.pending;
            document.getElementById("stat-processing").textContent =
              processing.length;
            document.getElementById("stat-completed").textContent =
              completedCount;
            document.getElementById("stat-failed").textContent = failedCount;

            // Split pending jobs by queue type
            var fifoJobs = pending.filter(function (j) {
              return (j.queue || "fifo") === "fifo";
            });
            var priorityJobs = pending.filter(function (j) {
              return j.queue === "priority";
            });
            var rateJobs = pending.filter(function (j) {
              return j.queue === "rate-limited";
            });

            // Update queue columns
            renderMiniQueue("queue-fifo", fifoJobs);
            renderMiniQueue("queue-priority", priorityJobs);
            renderMiniQueue("queue-rate", rateJobs);
            document.getElementById("count-fifo").textContent =
              fifoJobs.length + " jobs";
            document.getElementById("count-priority").textContent =
              priorityJobs.length + " jobs";
            document.getElementById("count-rate").textContent =
              rateJobs.length + " jobs";

            // Token display
            var tokensDisplay = document.getElementById("tokens-display");
            if (rateJobs.length > 0 || stats.rate_tokens !== undefined) {
              var tokens = stats.rate_tokens || 0;
              var maxTokens = 10;
              var pct = Math.min(100, (tokens / maxTokens) * 100);
              tokensDisplay.innerHTML =
                "Tokens: " +
                tokens +
                "/" +
                maxTokens +
                '<div class="tokens-bar"><div class="tokens-fill" style="width:' +
                pct +
                '%;"></div></div>';
            } else {
              tokensDisplay.innerHTML = "";
            }

            // Worker state
            var currentProcessingIds = [];
            for (var i = 0; i < 5; i++) {
              currentProcessingIds.push(
                processing[i] ? processing[i].id : null,
              );
            }

            for (var i = 0; i < 5; i++) {
              var prevId = previousProcessingIds[i];
              var currId = currentProcessingIds[i];
              if (workerFlash[i] !== null) continue;
              if (prevId && prevId !== currId) {
                var finishedJob = currentJobs[prevId];
                if (
                  finishedJob &&
                  (finishedJob.status === "completed" ||
                    finishedJob.status === "failed")
                ) {
                  workerFlash[i] = {
                    to: finishedJob.to,
                    subject: finishedJob.subject,
                    status: finishedJob.status,
                    priority: finishedJob.priority || 1,
                  };
                  (function (idx) {
                    setTimeout(function () {
                      workerFlash[idx] = null;
                    }, 3000);
                  })(i);
                }
              }
            }
            previousProcessingIds = currentProcessingIds;

            // Worker grid — update cards in place, no rebuilding
            var workerGrid = document.getElementById("worker-grid");

            if (
              workerGrid.children.length < 5 ||
              !document.getElementById("worker-0")
            ) {
              var initialHtml = "";
              for (var i = 0; i < 5; i++) {
                initialHtml +=
                  '<div class="worker-card" id="worker-' +
                  i +
                  '">' +
                  '<div class="worker-name">Worker #' +
                  (i + 1) +
                  "</div>" +
                  '<div class="worker-content"></div>' +
                  "</div>";
              }
              workerGrid.innerHTML = initialHtml;
            }

            for (var i = 0; i < 5; i++) {
              var active = processing[i] || null;
              var card = document.getElementById("worker-" + i);
              if (!card) continue;
              var content = card.querySelector(".worker-content");
              if (!content) continue;

              // Only update if something changed
              var newState = active
                ? "active-" + active.id + "-" + (active.priority || 1)
                : workerFlash[i]
                  ? "flash-" + workerFlash[i].status
                  : "idle";
              if (card.dataset.state === newState) continue;
              card.dataset.state = newState;

              card.className = "worker-card";
              card.style.transition =
                "border 0.3s ease, background 0.3s ease, box-shadow 0.3s ease";

              if (workerFlash[i] !== null) {
                var f = workerFlash[i];
                if (f.status === "completed") {
                  card.classList.add("completed-flash");
                  card.style.animation = "flashFade 2.5s ease forwards";
                } else {
                  card.classList.add("failed-flash");
                  card.style.animation = "flashFadeRed 2.5s ease forwards";
                }
                var icon = f.status === "completed" ? "&#10003;" : "&#10007;";
                var color = f.status === "completed" ? "#4ade80" : "#f87171";
                var label = f.status === "completed" ? "COMPLETED" : "FAILED";
                content.innerHTML =
                  '<div class="result-icon" style="color:' +
                  color +
                  ';">' +
                  icon +
                  "</div>" +
                  '<div class="worker-status" style="color:' +
                  color +
                  ';">' +
                  label +
                  "</div>" +
                  '<div class="worker-job-id">' +
                  f.to.substring(0, 18) +
                  "</div>" +
                  '<div class="worker-job-id" style="font-size:0.55rem;color:#64748b;">' +
                  f.subject +
                  "</div>";
                continue;
              }

              card.style.animation = "";

              if (active) {
                var prio = active.priority || 1;
                var qType = active.queue || "fifo";
                card.classList.add("active");
                if (prio === 2) card.classList.add("priority-2");
                if (prio === 3) card.classList.add("priority-3");
                content.innerHTML =
                  '<div class="queue-type-badge ' +
                  qType +
                  '">' +
                  (queueLabels[qType] || qType) +
                  "</div>" +
                  '<div class="priority-badge prio-' +
                  prio +
                  '">' +
                  prioNames[prio] +
                  "</div>" +
                  '<div class="worker-status">PROCESSING</div>' +
                  '<div class="spinner"></div>' +
                  '<div class="worker-job-id">' +
                  active.to.substring(0, 18) +
                  "</div>" +
                  '<div class="worker-job-id" style="font-size:0.55rem;color:#64748b;">' +
                  active.subject +
                  "</div>";
              } else {
                content.innerHTML =
                  '<div class="worker-status">IDLE</div>' +
                  '<div class="spinner" style="visibility:hidden;"></div>';
              }
            }
            // Jobs table
            var tbody = document.getElementById("jobs-table");
            var recentJobs = jobs.slice(0, 20);
            tbody.innerHTML = recentJobs
              .map(function (j) {
                var maxRetries = j.max_retries || j.MaxRetries || 3;
                var prio = j.priority || 1;
                var qType = j.queue || "fifo";
                var prevState = previousJobs[j.id];
                var rowClass = "";
                if (
                  j.status === "completed" &&
                  prevState &&
                  prevState.status !== "completed"
                )
                  rowClass = "row-completed";
                if (
                  j.status === "failed" &&
                  prevState &&
                  prevState.status !== "failed"
                )
                  rowClass = "row-failed";
                return (
                  '<tr class="' +
                  rowClass +
                  '">' +
                  '<td style="font-family:monospace;font-size:0.7rem;">' +
                  j.id.substring(0, 12) +
                  "...</td>" +
                  "<td>" +
                  j.to +
                  "</td>" +
                  "<td>" +
                  j.subject +
                  "</td>" +
                  "<td>" +
                  '<span class="badge badge-' +
                  j.status +
                  '">' +
                  j.status +
                  "</span>" +
                  (j.status === "failed"
                    ? " <button onclick=\"retryJob('" +
                      j.id +
                      '\')" style="background:#f87171;color:#fff;border:none;padding:0.15rem 0.5rem;border-radius:0.25rem;cursor:pointer;font-size:0.65rem;margin-left:0.3rem;">RETRY</button>'
                    : "") +
                  "</td>" +
                  '<td style="color:' +
                  prioColors[prio] +
                  ';font-weight:600;font-size:0.75rem;">' +
                  prioNames[prio] +
                  "</td>" +
                  '<td><span class="badge badge-' +
                  j.status +
                  '">' +
                  j.status +
                  "</span></td>" +
                  "<td>" +
                  j.retry_count +
                  "/" +
                  maxRetries +
                  "</td>" +
                  '<td style="font-size:0.7rem;color:#94a3b8;">' +
                  timeAgo(j.created_at) +
                  "</td>" +
                  "</tr>"
                );
              })
              .join("");

            previousJobs = currentJobs;
          })
          .catch(function (e) {
            console.error("Dashboard error:", e);
          });
      }

      function renderMiniQueue(elementId, jobs) {
        var el = document.getElementById(elementId);
        if (jobs.length === 0) {
          el.innerHTML = '<span class="queue-empty">Empty</span>';
          return;
        }
        var h = "";
        jobs.forEach(function (j, idx) {
          var prio = j.priority || 1;
          var badge = "";
          if (prio === 2)
            badge = '<span class="queue-badge urgent">URGENT</span>';
          if (prio === 3)
            badge = '<span class="queue-badge super">SUPER</span>';
          h +=
            '<div class="queue-mini-item prio-' +
            prio +
            '">#' +
            (idx + 1) +
            badge +
            ": " +
            j.to.substring(0, 15) +
            "</div>";
        });
        el.innerHTML = h;
      }

      function retryJob(jobId) {
        fetch("/jobs/" + jobId + "/retry", { method: "POST" })
          .then(function (r) {
            return r.json();
          })
          .then(function (data) {
            console.log("Retried job:", data);
            fetchData();
          })
          .catch(function (e) {
            console.error("Retry failed:", e);
          });
      }

      fetchData();
      setInterval(fetchData, 2000);
    </script>
  </body>
</html>
