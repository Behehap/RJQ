server:
  port: 8080

queue:
  workers: 5
  demo_delay_seconds: 0
  cooldown_seconds: 0

email:
  mode: "test" #"test" for Mailpit, "production" for real SMTP

  smtp_host: "smtp.gmail.com"
  smtp_port: 587
  smtp_user: ""
  smtp_pass: ""

  test_host: "mailpit"
  test_port: 1025
  test_user: "rjq@localhost"
  test_pass: ""

retry:
  max_attempts: 3
  backoff_seconds: 5

timeout:
  job_seconds: 30

rate_limit:
  emails_per_minute: 3
  burst: 1

database:
  backend: "postgres" # sqlite or postgres
  sqlite_path: "rjq.db"
  postgres_dsn: "postgres://rjq:rjq@localhost:5432/rjq?sslmode=disable"
