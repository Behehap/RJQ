services:
  rjq:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/app/config.yaml
    environment:
      - RJQ_EMAIL_SMTP_USER=${RJQ_EMAIL_SMTP_USER:-}
      - RJQ_EMAIL_SMTP_PASS=${RJQ_EMAIL_SMTP_PASS:-}
      - RJQ_DATABASE_BACKEND=postgres
      - RJQ_DATABASE_POSTGRES_DSN=postgres://rjq:rjq@postgres:5432/rjq?sslmode=disable
    depends_on:
      - postgres
      - mailpit
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rjq
      POSTGRES_PASSWORD: rjq
      POSTGRES_DB: rjq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=true
      - MP_SMTP_AUTH_ALLOW_INSECURE=true
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pgdata:
  grafana_data: